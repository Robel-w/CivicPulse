version: "3.8"

services:

  db:
    image: mysql:8.0
    container_name: civicpulse-mysql

    restart: always

    environment:
      MYSQL_DATABASE: civicpulse
      MYSQL_ROOT_PASSWORD: ""

      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"

    ports:
      - "3307:3306"

    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend

    container_name: civicpulse-backend

    depends_on:
      - db

    ports:
      - "8080:8080"

    environment:

      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/civicpulse?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC

      SPRING_DATASOURCE_USERNAME: root

      SPRING_DATASOURCE_PASSWORD: ""

  frontend:
    build: ./frontend

    container_name: civicpulse-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

volumes:
  db_data: