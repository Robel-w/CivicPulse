server:
  port: 8080

app:
  public-url: http://localhost:8080

spring:
  datasource:
    url: jdbc:mysql://db:3306/civicpulse?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: ""                     # Empty if no password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect   # Good to add

  sql:
    init:
      mode: always